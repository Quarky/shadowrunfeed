name: Update Star Wars FFG curated RSS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "star-wars/catalog.json"
      - "star-wars/generate_feed.py"
      - "star-wars/generate_cover.py"
      - ".github/workflows/update-star-wars-feed.yml"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

concurrency:
  group: star-wars-podcast-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python for artwork generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate script syntax
        run: python3 -m py_compile star-wars/generate_feed.py star-wars/generate_cover.py

      - name: Prepare podcast artwork
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 star-wars/generate_cover.py
          python3 - <<'PY'
          from PIL import Image
          img = Image.open("star-wars/cover.png")
          img.verify()
          img = Image.open("star-wars/cover.png")
          assert img.size == (2000, 2000) and img.format == "PNG"
          PY

      - name: Build source-verified curated feeds
        run: python3 star-wars/generate_feed.py

      - name: Validate emitted podcast RSS
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          feeds = list(pathlib.Path("star-wars").glob("*.xml"))
          assert feeds, "No RSS files emitted"
          for path in feeds:
              root = ET.parse(path).getroot()
              assert root.tag == "rss"
              channel = root.find("channel")
              image = channel.find("{http://www.itunes.com/dtds/podcast-1.0.dtd}image")
              assert image is not None and image.get("href", "").startswith("https://"), f"Missing HTTPS artwork: {path}"
              if path.name in ("feed.xml", "feed-v2.xml", "d6-feed.xml"):
                  assert image.get("href", "").endswith("/cover.png"), f"Sampler must use original PNG art: {path}"
              items = channel.findall("item")
              assert items, f"Empty podcast feed: {path}"
              for item in items:
                  enclosure = item.find("enclosure")
                  assert enclosure is not None and enclosure.get("url", "").startswith(("http://", "https://")), path
              if path.name in ("feed.xml", "feed-v2.xml"):
                  assert all(
                      int(x.find("enclosure").get("length", "0")) > 0
                      and x.find("enclosure").get("url", "").startswith("https://")
                      for x in items
                  ), f"Sampler contains an invalid audio enclosure: {path}"
              print(f"Validated {path} ({len(items)} playable entries)")
          PY

      - name: Commit updated independent feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add star-wars/*.xml star-wars/status.json star-wars/cover.png
          if git diff --cached --quiet; then
            echo "Star Wars podcast feed unchanged"
          else
            git commit -m "Publish updated Star Wars FFG curated podcast feeds"
            git push
          fi
