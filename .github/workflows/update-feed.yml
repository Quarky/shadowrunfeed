name: Update filtered RSS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generate_feed.py"
      - ".github/workflows/update-feed.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Arcology-only feed
        run: python3 generate_feed.py

      - name: Commit feed if changed
        run: |
          if git diff --quiet -- feed.xml 2>/dev/null && git ls-files --error-unmatch feed.xml >/dev/null 2>&1; then
            echo "feed.xml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "Update Arcology RSS feed"
          git push
