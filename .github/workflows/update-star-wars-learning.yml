name: Update Star Wars Ranked Feed and Featured Story Mix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "star-wars/learning_catalog.json"
      - "star-wars/frontier-mix-catalog.json"
      - "star-wars/generate_learning.py"
      - "star-wars/generate_frontier_mix.py"
      - "star-wars/publish_original_subscription.py"
      - "star-wars/build_staged_subscription.py"
      - "star-wars/expansion-catalog.json"
      - "star-wars/generate_expansion.py"
      - "star-wars/bonus-20-catalog.json"
      - "star-wars/generate_bonus_mix.py"
      - "star-wars/interleave-fiction-catalog.json"
      - "star-wars/generate_story_interleave.py"
      - ".github/workflows/update-star-wars-learning.yml"
  schedule:
    - cron: "13 6 * * 1"

permissions:
  contents: write

concurrency:
  group: star-wars-main-ranked-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
          fetch-depth: 0

      - name: Sync latest main before regenerating
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Verify Python builders
        run: |
          python3 -m py_compile star-wars/generate_learning.py star-wars/generate_frontier_mix.py star-wars/generate_expansion.py star-wars/generate_bonus_mix.py star-wars/generate_story_interleave.py star-wars/publish_original_subscription.py star-wars/build_staged_subscription.py star-wars/generate_feed.py

      - name: Protect all independent Star Wars feeds
        run: |
          sha256sum star-wars/d6-feed.xml star-wars/campaign-mynock.xml star-wars/dice-for-brains.xml star-wars/force-majeure.xml star-wars/nastygram-d6.xml star-wars/redemption.xml star-wars/respect-the-crit.xml > /tmp/untouched-star-wars-feeds.sha256

      - name: Rebuild original Lore/Story base from publisher feeds
        run: python3 star-wars/generate_learning.py

      - name: Prepend ten themed episodes and five lore/story pairs to subscribed main feed
        run: python3 star-wars/generate_frontier_mix.py

      - name: Verify the twenty previously selected thematic actual plays from independent publishers
        run: python3 star-wars/generate_expansion.py

      - name: Verify twenty distinctive scripted drama and tabletop actual-play episodes
        run: python3 star-wars/generate_bonus_mix.py

      - name: Verify fiction chapters for pairing with the existing twenty actual plays
        run: python3 star-wars/generate_story_interleave.py

      - name: Build isolated 130 entry debug RSS only
        run: python3 star-wars/publish_original_subscription.py

      - name: Build 140-entry deduplicated candidate while preserving 100 originals
        run: python3 star-wars/build_staged_subscription.py

      - name: Validate exact 100 original and separate 130 and 140 staging copies
        run: |
          sha256sum --check /tmp/untouched-star-wars-feeds.sha256
          python3 - <<'PY'
          import xml.etree.ElementTree as ET,json
          from pathlib import Path
          from urllib.parse import urlsplit,unquote
          p=Path("star-wars")
          def items(name):
              root=ET.parse(p/name).getroot()
              assert root.tag=="rss",name
              it=root.find("channel").findall("item")
              assert len({x.findtext("guid") for x in it})==len(it),name
              assert all(x.find("enclosure") is not None and x.find("enclosure").get("url","").startswith("https://") and int(x.find("enclosure").get("length","0"))>0 for x in it),name
              return it
          old,alias,debug,draft=(items(n) for n in ("feed-v2.xml","feed.xml","feed-130-debug.xml","feed-140-candidate.xml"))
          assert (len(old),len(alias),len(debug),len(draft))==(100,100,130,140)
          def semantic(e):
              return (e.tag,tuple(sorted(e.attrib.items())),(e.text or "").strip(),tuple(semantic(c) for c in e))
          assert all(semantic(x)==semantic(y) for x,y in zip(old,alias)),"Production aliases changed original episode data"
          assert all(semantic(x)==semantic(y) for x,y in zip(old,draft)),"Staged copy changed original episode data"
          def audio(i):
              u=urlsplit(i.find("enclosure").get("url"))
              return u.netloc.casefold().replace("dcs-cached.megaphone.fm","dcs-spotify.megaphone.fm")+unquote(u.path).replace("/secure/","/").casefold()
          assert len({audio(i) for i in draft})==140
          assert {audio(i) for i in debug}<={audio(i) for i in draft}
          prod=json.loads((p/"subscriber-status.json").read_text())
          test=json.loads((p/"staging-130-status.json").read_text())
          final=json.loads((p/"candidate-status.json").read_text())
          assert prod["episode_count"]==100 and prod["state"]=="published"
          assert test["episode_count"]==130 and test["state"]=="staging"
          assert final["episode_count"]==140 and final["preserved_original_guids"]==100 and final["new_unique_audio"]==40 and final["release_approved"]==False
          print("PASS: 100 frozen, 130 debug isolated, 140 unique candidate ready for import testing; NO production promotion")
          PY

      - name: Commit staging copies only; NEVER production
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          generated=(
            star-wars/learning-base-v2.xml
            star-wars/learning-base-episodes.md
            star-wars/learning-base-episodes.json
            star-wars/learning-base-status.json
            star-wars/learning-feed-v2.xml
            star-wars/learning-lore.xml
            star-wars/learning-story.xml
            star-wars/learning-episodes.md
            star-wars/learning-episodes.json
            star-wars/learning-status.json
            star-wars/frontier-mix.xml
            star-wars/frontier-mix-episodes.md
            star-wars/frontier-mix-episodes.json
            star-wars/frontier-mix-status.json
            star-wars/feed-130-debug.xml
            star-wars/staging-130-status.json
            star-wars/feed-140-candidate.xml
            star-wars/candidate-status.json
            star-wars/expansion.xml
            star-wars/expansion-episodes.md
            star-wars/expansion-episodes.json
            star-wars/expansion-status.json
            star-wars/bonus-20.xml
            star-wars/bonus-20-episodes.md
            star-wars/bonus-20-episodes.json
            star-wars/bonus-20-status.json
            star-wars/story-interleave.xml
            star-wars/story-interleave-episodes.md
            star-wars/story-interleave-episodes.json
            star-wars/story-interleave-status.json
          )
          tar -cf /tmp/star-wars-generated.tar "${generated[@]}"
          sourcefiles=(
            star-wars/learning_catalog.json
            star-wars/frontier-mix-catalog.json
            star-wars/generate_learning.py
            star-wars/generate_frontier_mix.py
            .github/workflows/update-star-wars-learning.yml
            star-wars/publish_original_subscription.py
            star-wars/build_staged_subscription.py
            star-wars/expansion-catalog.json
            star-wars/generate_expansion.py
            star-wars/bonus-20-catalog.json
            star-wars/generate_bonus_mix.py
            star-wars/interleave-fiction-catalog.json
            star-wars/generate_story_interleave.py
          )
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              if ! git diff --quiet HEAD origin/main -- "${sourcefiles[@]}"; then
                echo "Upstream generator or source catalog changed; refusing to publish stale source output" >&2
                exit 1
              fi
              git reset --hard origin/main
              tar -xf /tmp/star-wars-generated.tar
            fi
            git add "${generated[@]}"
            if git diff --cached --quiet; then
              echo "Main ranked Star Wars RSS already up to date"
              exit 0
            fi
            git commit -m "Refresh isolated Star Wars 130/140 test RSS only"
            if git push origin HEAD:main; then
              echo "Published to existing Star Wars subscription on attempt $attempt"
              exit 0
            fi
            echo "Main advanced during push; reconciling generated files" >&2
          done
          echo "Could not safely publish within four reconciliation attempts" >&2
          exit 1

