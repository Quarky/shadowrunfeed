name: Update Star Wars Ranked Feed and Featured Story Mix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "star-wars/learning_catalog.json"
      - "star-wars/frontier-mix-catalog.json"
      - "star-wars/generate_learning.py"
      - "star-wars/generate_frontier_mix.py"
      - "star-wars/publish_original_subscription.py"
      - "star-wars/expansion-catalog.json"
      - "star-wars/generate_expansion.py"
      - "star-wars/bonus-20-catalog.json"
      - "star-wars/generate_bonus_mix.py"
      - "star-wars/interleave-fiction-catalog.json"
      - "star-wars/generate_story_interleave.py"
      - ".github/workflows/update-star-wars-learning.yml"
  schedule:
    - cron: "13 6 * * 1"

permissions:
  contents: write

concurrency:
  group: star-wars-main-ranked-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
          fetch-depth: 0

      - name: Sync latest main before regenerating
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Verify Python builders
        run: |
          python3 -m py_compile star-wars/generate_learning.py star-wars/generate_frontier_mix.py star-wars/generate_expansion.py star-wars/generate_bonus_mix.py star-wars/generate_story_interleave.py star-wars/publish_original_subscription.py star-wars/generate_feed.py

      - name: Protect all independent Star Wars feeds
        run: |
          sha256sum star-wars/d6-feed.xml star-wars/campaign-mynock.xml star-wars/dice-for-brains.xml star-wars/force-majeure.xml star-wars/nastygram-d6.xml star-wars/redemption.xml star-wars/respect-the-crit.xml > /tmp/untouched-star-wars-feeds.sha256

      - name: Rebuild original Lore/Story base from publisher feeds
        run: python3 star-wars/generate_learning.py

      - name: Prepend ten themed episodes and five lore/story pairs to subscribed main feed
        run: python3 star-wars/generate_frontier_mix.py

      - name: Verify the twenty previously selected thematic actual plays from independent publishers
        run: python3 star-wars/generate_expansion.py

      - name: Verify twenty distinctive scripted drama and tabletop actual-play episodes
        run: python3 star-wars/generate_bonus_mix.py

      - name: Verify fiction chapters for pairing with the existing twenty actual plays
        run: python3 star-wars/generate_story_interleave.py

      - name: Publish combined episodes to actual originally subscribed RSS path
        run: python3 star-wars/publish_original_subscription.py

      - name: Validate full published subscriber feed, preserving earlier episode identities
        run: |
          sha256sum --check /tmp/untouched-star-wars-feeds.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          root=Path("star-wars")
          load=lambda f: json.loads((root/f).read_text(encoding="utf-8"))
          def rss(name,expected):
              ch=ET.parse(root/name).getroot().find("channel")
              assert ch is not None,name
              items=ch.findall("item")
              assert len(items)==expected,(name,len(items),expected)
              for item in items:
                  enc=item.find("enclosure")
                  assert enc is not None and enc.get("url","").startswith("https://")
                  assert int(enc.get("length","0"))>0
              assert len({x.findtext("guid") for x in items})==len(items)
              return items
          base=load("learning-base-status.json")
          ranked=load("learning-status.json")
          special=load("frontier-mix-status.json")
          assert base["state"]==ranked["state"]==special["state"]=="published"
          assert special["count"]==20 and special["drama_count"]==5 and special["actual_play_count"]==5
          ranked_items=rss("learning-feed-v2.xml",ranked["episodes"])
          assert ranked["episodes"]>=60
          assert len(rss("frontier-mix.xml",20))==20
          assert len(rss("learning-base-v2.xml",base["episodes"]))==base["episodes"]
          exp=load("expansion-status.json")
          exp_rows=load("expansion-episodes.json")["episodes"]
          assert exp["count"]==len(exp_rows)==20
          assert exp["first_section"]==exp["second_section"]==10
          assert [r["theme"] for r in exp_rows]==["remote-complex"]*10+["sith-ruins"]*10
          exp_items=rss("expansion.xml",20)
          bonus=load("bonus-20-status.json")
          bonus_rows=load("bonus-20-episodes.json")["episodes"]
          assert bonus["state"]=="published" and bonus["count"]==len(bonus_rows)==20
          assert bonus["drama_count"]==bonus["actual_play_count"]==10
          assert bonus["moraband_count"]==bonus["shard_moon_count"]==10
          assert bonus["unique_productions"]==20
          assert [r["theme"] for r in bonus_rows]==["moraband"]*10+["shard-moon"]*10
          assert [r["kind"] for r in bonus_rows]==["DRAMA","ACTUAL_PLAY"]*10
          assert len({r["show"] for r in bonus_rows})==20
          bonus_items=rss("bonus-20.xml",20)
          drama=load("story-interleave-status.json")
          drama_rows=load("story-interleave-episodes.json")["episodes"]
          assert drama["state"]=="published" and drama["fiction_episodes"]==20
          assert drama["facility_fiction"]==drama["ancient_force_fiction"]==10
          assert drama["fan_fiction_count"]==10
          assert [r["theme"] for r in drama_rows]==["remote-complex"]*10+["sith-ruins"]*10
          drama_items=rss("story-interleave.xml",20)
          status=load("subscriber-status.json")
          assert status["state"]=="published"
          assert status["new_actual_plays"]==20 and status["new_fiction_episodes"]==20
          assert status["new_interleaved_pairs"]==20 and status["community_star_wars_fiction"]==10
          assert status["bonus_episodes"]==20
          assert status["bonus_drama_count"]==status["bonus_actual_play_count"]==10
          count=status["episode_count"]
          assert count==status["previous_episode_count"]+60
          assert count>=130
          main=rss("feed-v2.xml",count)
          alias=rss("feed.xml",count)
          assert [x.findtext("guid") for x in main]==[x.findtext("guid") for x in alias]
          assert [x.find("enclosure").get("url") for x in main[:20]]==[x.find("enclosure").get("url") for x in ranked_items[:20]]
          paired=main[-60:-20]
          assert len(paired)==40
          assert [x.findtext("guid") for x in paired[::2]]==[x.findtext("guid") for x in drama_items]
          assert [x.findtext("guid") for x in paired[1::2]]==[x.findtext("guid") for x in exp_items]
          assert all("STORY" in (x.findtext("title") or "") or "DRAMA" in (x.findtext("title") or "") for x in paired[::2])
          assert all("ACTUAL PLAY" in (x.findtext("title") or "") for x in paired[1::2])
          assert [x.findtext("guid") for x in main[-20:]]==[x.findtext("guid") for x in bonus_items]
          old=rss("sampler-v2.xml",status["legacy_original_count"])
          assert {x.findtext("guid") for x in old}<={x.findtext("guid") for x in main}
          assert status["original_subscriber_guids_preserved"]==len(old)
          from urllib.parse import urlsplit,unquote
          def identity(url):
              x=urlsplit(url)
              return x.netloc.casefold().replace("dcs-cached.megaphone.fm","dcs-spotify.megaphone.fm")+unquote(x.path).replace("/secure/","/").casefold()
          urls=[identity(x.find("enclosure").get("url")) for x in main]
          assert len(set(urls))==len(urls),"A previously published audio recording was duplicated"
          dates=[parsedate_to_datetime(x.findtext("pubDate")) for x in main]
          assert dates==sorted(dates,reverse=True)
          print("PASS: original subscription contains",count,"episodes, 20 fiction chapters interleaved with twenty original actual plays, separate bonus preserved, original GUIDs preserved")
          PY

      - name: Commit all coherent generated Star Wars feeds without racing another updater
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          generated=(
            star-wars/learning-base-v2.xml
            star-wars/learning-base-episodes.md
            star-wars/learning-base-episodes.json
            star-wars/learning-base-status.json
            star-wars/learning-feed-v2.xml
            star-wars/learning-lore.xml
            star-wars/learning-story.xml
            star-wars/learning-episodes.md
            star-wars/learning-episodes.json
            star-wars/learning-status.json
            star-wars/frontier-mix.xml
            star-wars/frontier-mix-episodes.md
            star-wars/frontier-mix-episodes.json
            star-wars/frontier-mix-status.json
            star-wars/feed-v2.xml
            star-wars/feed.xml
            star-wars/subscriber-status.json
            star-wars/expansion.xml
            star-wars/expansion-episodes.md
            star-wars/expansion-episodes.json
            star-wars/expansion-status.json
            star-wars/bonus-20.xml
            star-wars/bonus-20-episodes.md
            star-wars/bonus-20-episodes.json
            star-wars/bonus-20-status.json
            star-wars/story-interleave.xml
            star-wars/story-interleave-episodes.md
            star-wars/story-interleave-episodes.json
            star-wars/story-interleave-status.json
          )
          tar -cf /tmp/star-wars-generated.tar "${generated[@]}"
          sourcefiles=(
            star-wars/learning_catalog.json
            star-wars/frontier-mix-catalog.json
            star-wars/generate_learning.py
            star-wars/generate_frontier_mix.py
            .github/workflows/update-star-wars-learning.yml
            star-wars/publish_original_subscription.py
            star-wars/expansion-catalog.json
            star-wars/generate_expansion.py
            star-wars/bonus-20-catalog.json
            star-wars/generate_bonus_mix.py
            star-wars/interleave-fiction-catalog.json
            star-wars/generate_story_interleave.py
          )
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              if ! git diff --quiet HEAD origin/main -- "${sourcefiles[@]}"; then
                echo "Upstream generator or source catalog changed; refusing to publish stale source output" >&2
                exit 1
              fi
              git reset --hard origin/main
              tar -xf /tmp/star-wars-generated.tar
            fi
            git add "${generated[@]}"
            if git diff --cached --quiet; then
              echo "Main ranked Star Wars RSS already up to date"
              exit 0
            fi
            git commit -m "Publish auto-updated Star Wars ranked RSS with featured story opening"
            if git push origin HEAD:main; then
              echo "Published to existing Star Wars subscription on attempt $attempt"
              exit 0
            fi
            echo "Main advanced during push; reconciling generated files" >&2
          done
          echo "Could not safely publish within four reconciliation attempts" >&2
          exit 1

      - name: Check podcast CDN cache and request refresh when stale
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          url="https://cdn.jsdelivr.net/gh/Quarky/shadowrunfeed@main/star-wars/feed-v2.xml"
          expected=$(grep -c '<item>' star-wars/feed-v2.xml)
          echo "Published original subscriber RSS items: $expected"
          if curl --fail --silent --show-error --location --max-time 20 "$url" -o /tmp/subscriber-cdn.xml; then
            actual=$(grep -c '<item>' /tmp/subscriber-cdn.xml || true)
            echo "Currently cached at original subscription URL: $actual"
            if [ "$actual" -ne "$expected" ]; then
              echo "CDN branch cache is stale; asking jsDelivr to invalidate this public URL"
              curl --silent --show-error --location --max-time 20                 "https://purge.jsdelivr.net/gh/Quarky/shadowrunfeed@main/star-wars/feed-v2.xml"                 | head -c 800 || true
              echo
              sleep 4
              if curl --fail --silent --show-error --location --max-time 20 "$url" -o /tmp/subscriber-cdn-refreshed.xml; then
                fresh=$(grep -c '<item>' /tmp/subscriber-cdn-refreshed.xml || true)
                echo "CDN after purge request: $fresh items (expecting $expected)"
                if [ "$fresh" -ne "$expected" ]; then
                  echo "::warning::GitHub RSS has $expected episodes, but jsDelivr's 12-hour branch cache currently has $fresh. Podbean will update after CDN cache expiration."
                fi
              fi
            else
              echo "PASS: Existing Podbean CDN URL currently shows all $expected episodes"
            fi
          else
            echo "::warning::Could not read public CDN from this runner; GitHub source is published and validated."
          fi
