name: Update Star Wars Ranked Feed and Featured Story Mix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "star-wars/learning_catalog.json"
      - "star-wars/frontier-mix-catalog.json"
      - "star-wars/generate_learning.py"
      - "star-wars/generate_frontier_mix.py"
      - "star-wars/publish_original_subscription.py"
      - "star-wars/expansion-catalog.json"
      - "star-wars/generate_expansion.py"
      - ".github/workflows/update-star-wars-learning.yml"
  schedule:
    - cron: "13 6 * * 1"

permissions:
  contents: write

concurrency:
  group: star-wars-main-ranked-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
          fetch-depth: 0

      - name: Sync latest main before regenerating
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Verify Python builders
        run: |
          python3 -m py_compile star-wars/generate_learning.py star-wars/generate_frontier_mix.py star-wars/generate_expansion.py star-wars/publish_original_subscription.py star-wars/generate_feed.py

      - name: Protect all independent Star Wars feeds
        run: |
          sha256sum star-wars/d6-feed.xml star-wars/campaign-mynock.xml star-wars/dice-for-brains.xml star-wars/force-majeure.xml star-wars/nastygram-d6.xml star-wars/redemption.xml star-wars/respect-the-crit.xml > /tmp/untouched-star-wars-feeds.sha256

      - name: Rebuild original Lore/Story base from publisher feeds
        run: python3 star-wars/generate_learning.py

      - name: Prepend ten themed episodes and five lore/story pairs to subscribed main feed
        run: python3 star-wars/generate_frontier_mix.py

      - name: Verify twenty additional thematic actual plays from independent publishers
        run: python3 star-wars/generate_expansion.py

      - name: Publish combined episodes to actual originally subscribed RSS path
        run: python3 star-wars/publish_original_subscription.py

      - name: Validate merged subscriber feed and source episode identities
        run: |
          sha256sum --check /tmp/untouched-star-wars-feeds.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime

          root=Path("star-wars")
          load=lambda f: json.loads((root/f).read_text(encoding="utf-8"))
          base=load("learning-base-status.json")
          main=load("learning-status.json")
          special=load("frontier-mix-status.json")
          base_rows=load("learning-base-episodes.json")["episodes"]
          main_rows=load("learning-episodes.json")["episodes"]
          special_rows=load("frontier-mix-episodes.json")["episodes"]
          assert base["state"]==main["state"]==special["state"]=="published"
          assert base["pairs"]>=10 and base["episodes"]==2*base["pairs"]
          assert len(base_rows)==base["episodes"]
          assert len(main_rows)==main["episodes"]
          assert len(special_rows)==special["count"]==20
          assert main["featured_prefix"]==20
          assert special["drama_count"]==special["actual_play_count"]==special["normal_pairs"]==5
          assert [r["category"] for r in main_rows[:20]]==["DRAMA","ACTUAL_PLAY"]*5+["LORE","STORY"]*5
          assert [r["publisher_audio_url"] for r in main_rows[:20]]==[r["publisher_audio_url"] for r in special_rows]
          assert len({r["show"] for r in main_rows[:10:2]})==5
          assert len({r["show"] for r in main_rows[1:10:2]})==5
          assert [r["story_chapter"] for r in main_rows[11:20:2]]==[1,2,3,4,5]
          assert [r["kind"] for r in base_rows]==["LORE","STORY"]*base["pairs"]
          featured_urls={r["publisher_audio_url"] for r in special_rows}
          base_urls={r["publisher_audio_url"] for r in base_rows}
          main_urls={r["publisher_audio_url"] for r in main_rows}
          assert len(main_urls)==len(main_rows), "Duplicated main audio!"
          assert main_urls==featured_urls|base_urls, "Lost original episode when merging"
          assert main["episodes"]==len(featured_urls|base_urls)
          assert main["duplicates_suppressed"]==len(base_urls & featured_urls)
          assert main["core_unique_remaining"]==len(base_urls-featured_urls)
          assert main["original_ranked_content_retained"] is True
          assert main["warnings"]==base["warnings"]
          assert special["warnings"]==[]
          assert len([x for x in base["lore_sources"] if x["status"]=="included"])>=2
          assert len([x for x in base["story_arcs"] if x["status"]=="included"])>=3

          def parse(name,count):
              parsed=ET.parse(root/name)
              channel=parsed.getroot().find("channel")
              assert channel is not None
              items=channel.findall("item")
              assert len(items)==count,(name,len(items),count)
              logo=channel.find("{http://www.itunes.com/dtds/podcast-1.0.dtd}image")
              assert logo is not None and logo.get("href","").endswith("/cover.png")
              for item in items:
                  enclosure=item.find("enclosure")
                  assert enclosure is not None
                  assert enclosure.get("url","").startswith("https://")
                  assert int(enclosure.get("length","0"))>0
              guids=[i.findtext("guid") for i in items]
              assert all(guids) and len(set(guids))==len(guids)
              return channel,items

          _,base_items=parse("learning-base-v2.xml",len(base_rows))
          main_channel,main_items=parse("learning-feed-v2.xml",len(main_rows))
          _,mix_items=parse("frontier-mix.xml",20)
          parse("learning-lore.xml",base["pairs"])
          parse("learning-story.xml",base["pairs"])
          link=main_channel.find("{http://www.w3.org/2005/Atom}link")
          assert link is not None and link.get("href","").endswith("/star-wars/learning-feed-v2.xml")
          assert [i.find("enclosure").get("url") for i in main_items[:20]]==[i.find("enclosure").get("url") for i in mix_items]
          base_guid={x.find("enclosure").get("url"):x.findtext("guid") for x in base_items}
          for x in main_items:
              url=x.find("enclosure").get("url")
              if url in base_guid:
                  assert x.findtext("guid")==base_guid[url],f"GUID changed for existing subscriber: {url[:70]}"
          dates=[parsedate_to_datetime(x.findtext("pubDate")) for x in main_items]
          assert dates==sorted(dates,reverse=True), "Main feed not in listening order"
          assert [r["order"] for r in main_rows]==list(range(1,len(main_rows)+1))
          assert (root/"learning-episodes.md").read_text(encoding="utf-8").count(" | ")>=len(main_rows)
          expansion=load("expansion-status.json")
          extension_rows=load("expansion-episodes.json")["episodes"]
          assert expansion["state"]=="published" and expansion["count"]==20
          assert len(extension_rows)==20 and expansion["first_section"]==expansion["second_section"]==10
          assert len({r["publisher_audio_url"] for r in extension_rows})==20
          assert all(r["theme"]=="remote-complex" for r in extension_rows[:10])
          assert all(r["theme"]=="sith-ruins" for r in extension_rows[10:])
          assert expansion["new_publisher_programs"]>=8, "Too few distinct new actual-play productions"
          parse("expansion.xml",20)
          subscriber=load("subscriber-status.json")
          assert subscriber["state"]=="published"
          assert subscriber["special_prefix"]==20
          assert subscriber["legacy_original_count"]>=16
          assert subscriber["original_subscriber_guids_preserved"]==subscriber["legacy_original_count"]
          assert subscriber["previous_episode_count"]>=70
          assert subscriber["new_actual_plays"]==20
          assert subscriber["episode_count"]==subscriber["previous_episode_count"]+20
          assert subscriber["new_unique_productions"]==expansion["new_publisher_programs"]
          assert subscriber["new_groups"][0]["start"]==subscriber["previous_episode_count"]+1
          assert subscriber["new_groups"][1]["start"]==subscriber["previous_episode_count"]+11
          assert subscriber["episode_count"]>=len(main_rows)
          old_channel,old_episodes=parse("sampler-v2.xml",subscriber["legacy_original_count"])
          live_channel,live_episodes=parse("feed-v2.xml",subscriber["episode_count"])
          alias_channel,alias_episodes=parse("feed.xml",subscriber["episode_count"])
          assert [i.findtext("guid") for i in alias_episodes]==[i.findtext("guid") for i in live_episodes]
          for filename,ch in (("feed-v2.xml",live_channel),("feed.xml",alias_channel)):
              link=ch.find("{http://www.w3.org/2005/Atom}link")
              assert link is not None and link.get("href","").endswith("/star-wars/"+filename)
          assert [i.find("enclosure").get("url") for i in live_episodes[:20]]==[i.find("enclosure").get("url") for i in main_items[:20]]
          assert [i.find("enclosure").get("url") for i in live_episodes[-20:]]==[i.find("enclosure").get("url") for i in ET.parse(root/"expansion.xml").findall("./channel/item")]
          assert {i.findtext("guid") for i in live_episodes[-20:]}.isdisjoint({i.findtext("guid") for i in live_episodes[:-20]})
          old_guid_set={i.findtext("guid") for i in old_episodes}
          new_guid_set={i.findtext("guid") for i in live_episodes}
          assert old_guid_set<=new_guid_set, "Original Podbean episode GUIDs disappeared"
          assert len(old_guid_set)==subscriber["legacy_original_count"]
          assert len({i.find("enclosure").get("url").split("?")[0] for i in live_episodes})==len(live_episodes), "Original subscriber feed repeats publisher audio"
          publish_dates=[parsedate_to_datetime(i.findtext("pubDate")) for i in live_episodes]
          assert publish_dates==sorted(publish_dates,reverse=True), "Subscriber feed ordering incorrect"
          print("PASS:",len(live_episodes),"entries at actually subscribed feed-v2.xml;",
                "20 featured first, 20 new thematic actual plays last, all original IDs preserved")
          PY

      - name: Commit all coherent generated Star Wars feeds without racing another updater
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          generated=(
            star-wars/learning-base-v2.xml
            star-wars/learning-base-episodes.md
            star-wars/learning-base-episodes.json
            star-wars/learning-base-status.json
            star-wars/learning-feed-v2.xml
            star-wars/learning-lore.xml
            star-wars/learning-story.xml
            star-wars/learning-episodes.md
            star-wars/learning-episodes.json
            star-wars/learning-status.json
            star-wars/frontier-mix.xml
            star-wars/frontier-mix-episodes.md
            star-wars/frontier-mix-episodes.json
            star-wars/frontier-mix-status.json
            star-wars/feed-v2.xml
            star-wars/feed.xml
            star-wars/subscriber-status.json
            star-wars/expansion.xml
            star-wars/expansion-episodes.md
            star-wars/expansion-episodes.json
            star-wars/expansion-status.json
          )
          tar -cf /tmp/star-wars-generated.tar "${generated[@]}"
          sourcefiles=(
            star-wars/learning_catalog.json
            star-wars/frontier-mix-catalog.json
            star-wars/generate_learning.py
            star-wars/generate_frontier_mix.py
            .github/workflows/update-star-wars-learning.yml
            star-wars/publish_original_subscription.py
            star-wars/expansion-catalog.json
            star-wars/generate_expansion.py
          )
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              if ! git diff --quiet HEAD origin/main -- "${sourcefiles[@]}"; then
                echo "Upstream generator or source catalog changed; refusing to publish stale source output" >&2
                exit 1
              fi
              git reset --hard origin/main
              tar -xf /tmp/star-wars-generated.tar
            fi
            git add "${generated[@]}"
            if git diff --cached --quiet; then
              echo "Main ranked Star Wars RSS already up to date"
              exit 0
            fi
            git commit -m "Publish auto-updated Star Wars ranked RSS with featured story opening"
            if git push origin HEAD:main; then
              echo "Published to existing Star Wars subscription on attempt $attempt"
              exit 0
            fi
            echo "Main advanced during push; reconciling generated files" >&2
          done
          echo "Could not safely publish within four reconciliation attempts" >&2
          exit 1

      - name: Check podcast CDN cache and request refresh when stale
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          url="https://cdn.jsdelivr.net/gh/Quarky/shadowrunfeed@main/star-wars/feed-v2.xml"
          expected=$(grep -c '<item>' star-wars/feed-v2.xml)
          echo "Published original subscriber RSS items: $expected"
          if curl --fail --silent --show-error --location --max-time 20 "$url" -o /tmp/subscriber-cdn.xml; then
            actual=$(grep -c '<item>' /tmp/subscriber-cdn.xml || true)
            echo "Currently cached at original subscription URL: $actual"
            if [ "$actual" -ne "$expected" ]; then
              echo "CDN branch cache is stale; asking jsDelivr to invalidate this public URL"
              curl --silent --show-error --location --max-time 20                 "https://purge.jsdelivr.net/gh/Quarky/shadowrunfeed@main/star-wars/feed-v2.xml"                 | head -c 800 || true
              echo
              sleep 4
              if curl --fail --silent --show-error --location --max-time 20 "$url" -o /tmp/subscriber-cdn-refreshed.xml; then
                fresh=$(grep -c '<item>' /tmp/subscriber-cdn-refreshed.xml || true)
                echo "CDN after purge request: $fresh items (expecting $expected)"
                if [ "$fresh" -ne "$expected" ]; then
                  echo "::warning::GitHub RSS has $expected episodes, but jsDelivr's 12-hour branch cache currently has $fresh. Podbean will update after CDN cache expiration."
                fi
              fi
            else
              echo "PASS: Existing Podbean CDN URL currently shows all $expected episodes"
            fi
          else
            echo "::warning::Could not read public CDN from this runner; GitHub source is published and validated."
          fi
