name: Publish Anomaly Story and Actual Play RSS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "anomaly/catalog.json"
      - "anomaly/publish_fresh_rss.py"
      - "anomaly/fresh-episode-catalog.json"
      - "anomaly/verify_published_rss.py"
      - "anomaly/README.md"
      - ".github/workflows/update-anomaly-feed.yml"
  schedule:
    - cron: "43 4 * * 2"

permissions:
  contents: write

concurrency:
  group: anomaly-curated-rss
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build fresh standalone RSS from all 120 vetted episodes
        run: python3 -u anomaly/publish_fresh_rss.py
      - name: Validate 120-track interleave, integrity and artwork
        run: |
          python3 - <<'PY'
          import json,xml.etree.ElementTree as E
          from pathlib import Path
          root=Path('anomaly')
          status=json.loads((root/'status.json').read_text())
          assert status['state']=='published',status
          assert status['total_episodes']==120,status
          assert status['story']==status['actual_play']==60
          assert status['interleave_valid']
          assert status['themes']['communities']==20
          assert not (Path("magudonya")).exists(), "retired feed directory was recreated"
          assert "Veyrun" not in (root/"feed-v2.xml").read_text(encoding="utf-8")
          assert "/anomaly/" in (root/"feed-v2.xml").read_text(encoding="utf-8")
          items=E.parse(root/'feed-v2.xml').findall('./channel/item')
          assert len(items)==120,len(items)
          ids=[x.findtext('guid') for x in items]
          assert len(set(ids))==120
          assert all(x.startswith('urn:uuid:') for x in ids)
          assert 'magudonya' not in (root/'feed-v2.xml').read_text(encoding='utf-8').lower()
          assert items[0].findtext('title').startswith('001 - STORY - ')
          assert E.parse(root/'feed-v2.xml').findtext('./channel/{http://www.itunes.com/dtds/podcast-1.0.dtd}explicit')=='true'
          assert all((x.find('enclosure').get('url') or '').startswith('https://') for x in items)
          assert all(int(x.find('enclosure').get('length',0))>0 for x in items)
          assert (root/'feed-v2.xml').read_bytes()==(root/'feed.xml').read_bytes()
          assert (root/'cover.png').read_bytes()[:8]==b'\x89PNG\r\n\x1a\n'
          data=json.loads((root/'episodes.json').read_text())
          assert len(data)==120
          assert not any(x["publisher"] in ("Worlds Beyond Number", "Dungeons of Drakkenheim") for x in data), "familiar listening leaked into main feed"
          optional=E.parse(root/'optional-listening'/'feed-v2.xml').findall('./channel/item')
          assert len(optional)==9, "familiar replay shelf should hold nine original episodes"
          assert all(data[i]['role']=='story' if i%2==0 else data[i]['role']=='actual_play' for i in range(120))
          assert {x['theme'] for x in data}==set(json.loads((root/'catalog.json').read_text())['themes'])
          print('PASS: 120 unique direct-publisher enclosures, 60/60 interleave, 6 chapters, PNG')
          PY
      - name: Publish validated feed and manifest to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anomaly/feed-v2.xml anomaly/feed.xml anomaly/status.json
          if git diff --cached --quiet; then
            echo "No changes to Anomaly RSS"
          else
            git commit -m "Publish rebuilt Anomaly RSS as a new 120-episode podcast"
            # Generated files are authoritative for this workflow; a concurrently
            # committed placeholder status must not create an add/add conflict.
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

      - name: Purge cached branch URL and verify what Podbean can actually fetch
        shell: bash
        run: |
          # A GitHub commit alone does not prove that @main is fresh at jsDelivr.
          # The checker records HTTP/cache headers, exact RSS SHA-256 matches
          # and Podbean-compatible episode metadata in cdn-health.json.
          set +e
          python3 -u anomaly/verify_published_rss.py
          check_status=$?
          set -e
          git add anomaly/cdn-health.json
          if ! git diff --cached --quiet; then
            git commit -m "Record live Anomaly podcast CDN and RSS refresh evidence"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
          exit "$check_status"
