name: Publish Shadowrun Story/AP/Lore Anthology

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shadowrun/anthology/build.py"
      - "shadowrun/anthology/policy.json"
      - "shadowrun/anthology/verify_delivery.py"
      - "shadowrun/anthology/append_pre_shutdown_lore.py"
      - ".github/workflows/publish-shadowrun-anthology.yml"

permissions:
  contents: write

concurrency:
  group: shadowrun-anthology-publish
  cancel-in-progress: false

jobs:
  anthology:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install cover renderer
        run: python3 -m pip install Pillow
      - name: Verify source syntax
        run: python3 -m py_compile shadowrun/anthology/build.py shadowrun/anthology/append_pre_shutdown_lore.py
      - name: Build and validate original publisher enclosures
        id: build
        shell: bash
        run: |
          set +e
          python3 shadowrun/anthology/build.py
          rc=$?
          if [ "$rc" = "0" ]; then
            python3 shadowrun/anthology/append_pre_shutdown_lore.py
            rc=$?
          fi
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit successful feed or blocked diagnostic
        shell: bash
        env:
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$BUILD_EXIT" = "0" ]; then
            git add shadowrun/anthology/feed-v1.xml shadowrun/anthology/selected.json shadowrun/anthology/cover.png shadowrun/anthology/status.json shadowrun/anthology/build-diagnostic.json shadowrun/anthology/v2/evidence-checkpoint-current.json shadowrun/anthology/v2/STATUS.md shadowrun/anthology/additions-diagnostic.json
          else
            git add shadowrun/anthology/build-diagnostic.json
            test ! -f shadowrun/anthology/additions-diagnostic.json || git add shadowrun/anthology/additions-diagnostic.json
          fi
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh Shadowrun anthology RSS and original media manifest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verify actual public RSS bytes against committed file
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PUBLISHED_COMMIT="$(git rev-parse HEAD)" python3 shadowrun/anthology/verify_delivery.py
          git add shadowrun/anthology/delivery-status.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Record Shadowrun anthology public CDN readback"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fail if published audio gate did not pass
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "::error::The anthology is not publishable. Inspect shadowrun/anthology/build-diagnostic.json for source-level blockers."
          exit 1
