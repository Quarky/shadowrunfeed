# Detailed scope, local command, pass/fail and rollback: anomaly/CANDIDATE_DISCOVERY_QA.md
name: Audit Anomaly Replacement Podcast Candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "anomaly/replacement_candidates.py"
      - ".github/workflows/anomaly-candidate-audit.yml"
permissions:
  contents: write
concurrency:
  group: anomaly-candidates
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Publisher RSS discovery and metadata-only audit
        run: python3 -u anomaly/replacement_candidates.py
      - name: Validate and save candidate evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("anomaly/replacement-candidates.json")
          x=json.loads(p.read_text().rstrip("\\n"))
          assert len(x["per_theme"]) == 6
          assert len(x["available_sources"]) > 4
          assert all(x["per_theme"][t]["story"] and x["per_theme"][t]["actual_play"] for t in x["per_theme"])
          print("PASS",len(x["available_sources"]),"original publisher sources with reusable candidate metadata")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anomaly/replacement-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified publisher RSS episode alternatives for Anomaly feed fixes"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
