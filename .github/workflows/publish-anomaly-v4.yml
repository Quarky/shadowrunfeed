name: Anomaly V4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'anomaly/v4/generate.py'
      - 'anomaly/v4/policy.json'
      - '.github/workflows/publish-anomaly-v4.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 anomaly/v4/run_and_diagnose.py
      - name: Commit published media index
        run: |
          git add anomaly/v4/build-diagnostic.json
          if [ -f anomaly/feed-v4.xml ]; then git add anomaly/feed-v4.xml anomaly/v4/selected.json anomaly/v4/status.json; fi
          git diff --cached --quiet || (git -c user.name=github-actions -c user.email=ci@example.invalid commit -m 'Publish Anomaly V4' && git push)
