name: Anomaly V4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'anomaly/v4/generate.py'
      - 'anomaly/v4/policy.json'
      - '.github/workflows/publish-anomaly-v4.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 anomaly/v4/generate.py
