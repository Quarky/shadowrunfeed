name: Publish Shadowrun 120-track RSS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shadowrun/build_120.py"
      - ".github/workflows/publish-shadowrun-120.yml"
permissions:
  contents: write
concurrency:
  group: shadowrun-120
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Check source syntax
        run: python3 -m py_compile shadowrun/build_120.py
      - name: Gather original publisher episode inventories and produce independent V3
        run: python3 -u shadowrun/build_120.py
      - name: Verify final episode mix and preserve old Shadowrun feeds
        shell: bash
        run: |
          python3 - <<'PY'
          import collections,json,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path("shadowrun")
          src=json.loads((root/"selected.json").read_text())
          meta=json.loads((root/"status.json").read_text())
          feed=ET.parse(root/"feed-v3.xml").getroot().find("channel")
          episodes=feed.findall("item")
          assert len(src)==len(episodes)==120
          assert dict(collections.Counter(e["role"] for e in src))=={"story":50,"actual_play":60,"lore":10}
          assert [e["role"] for e in src[:20]]==["story","actual_play"]*10
          assert [e["role"] for e in src[20:40]]==["lore","actual_play"]*10
          assert [e["role"] for e in src[40:]]==["actual_play","story"]*40
          assert len({x.findtext("guid") for x in episodes})==120
          assert len({x["audio_url"] for x in src})==120
          assert all(x["audio_url"].startswith("https://") and x["audio_length"]>0 and
                     x["audio_type"].startswith("audio/") for x in src)
          assert meta["full_transcripts_examined"]==0
          assert Path("feed.xml").read_bytes()==Path("feed-v2.xml").read_bytes()
          print("SOURCE/STRUCTURE PASS: 120 genuine publisher enclosure references; full transcript verification still pending")
          PY
      - name: Publish independent RSS and its manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadowrun/feed-v3.xml shadowrun/selected.json shadowrun/status.json
          if git diff --cached --quiet; then
            echo "Shadowrun V3 unchanged"
          else
            git commit -m "Publish Shadowrun 120-track curated RSS from publisher sources"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
