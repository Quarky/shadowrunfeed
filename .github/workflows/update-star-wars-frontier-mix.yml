name: Publish Frontier Mystery Audio and Actual Play Mix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "star-wars/frontier-mix-catalog.json"
      - "star-wars/generate_frontier_mix.py"
      - ".github/workflows/update-star-wars-frontier-mix.yml"
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: write

concurrency:
  group: star-wars-frontier-story-mix
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate generation scripts
        run: python3 -m py_compile star-wars/generate_frontier_mix.py star-wars/generate_learning.py
      - name: Protect existing independent feeds
        run: |
          sha256sum star-wars/feed-v2.xml star-wars/d6-feed.xml star-wars/learning-feed-v2.xml star-wars/learning-lore.xml star-wars/learning-story.xml > /tmp/original-podcast-sha
      - name: Generate 10 thematic plus 5 lore/story pairs
        run: python3 star-wars/generate_frontier_mix.py
      - name: Verify original audio and sequence
        run: |
          sha256sum --check /tmp/original-podcast-sha
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path("star-wars")
          d=json.loads((p/"frontier-mix-episodes.json").read_text())
          s=json.loads((p/"frontier-mix-status.json").read_text())
          rows=d["episodes"]
          assert s["state"]=="published" and not s["warnings"]
          assert s["count"]==20
          assert s["drama_count"]==s["actual_play_count"]==5 and s["normal_pairs"]==5
          assert [e["category"] for e in rows]==["DRAMA","ACTUAL_PLAY"]*5+["LORE","STORY"]*5
          assert len({e["show"] for e in rows[:10:2]})==5
          assert len({e["source_id"] for e in rows[:10:2] if "source_id" in e}) in (0,5)
          assert len({e["show"] for e in rows[1:10:2]})==5
          assert [e["story_chapter"] for e in rows[11::2]]==[1,2,3,4,5]
          assert len({e["publisher_audio_url"] for e in rows})==20
          assert all(e["publisher_audio_url"].startswith("https://") for e in rows)
          xml=ET.parse(p/"frontier-mix.xml").getroot()
          channel=xml.find("channel")
          assert len(channel.findall("item"))==20
          assert channel.find("{http://www.itunes.com/dtds/podcast-1.0.dtd}image").get("href","").endswith("/cover.png")
          items=channel.findall("item")
          assert all(int(item.find("enclosure").get("length","0"))>0 for item in items)
          assert len({item.findtext("guid") for item in items})==20
          assert (p/"frontier-mix-episodes.md").stat().st_size>3000
          print("PASS: 5 audio dramas, 5 actual plays and 5 consecutive lore/story pairs")
          PY
      - name: Commit separate verified RSS playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add star-wars/frontier-mix.xml star-wars/frontier-mix-status.json star-wars/frontier-mix-episodes.json star-wars/frontier-mix-episodes.md
          if git diff --cached --quiet; then
            echo "No frontier mix changes"
          else
            git commit -m "Publish verified frontier sci-fi drama and Star Wars RPG listening mix"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published on attempt $attempt"
                exit 0
              fi
            done
            echo "Cannot safely publish; preserving remote repository" >&2
            exit 1
          fi
